name: test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm test
      - name: Validate JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for p in [Path('manifest.json'), *Path('manifests').glob('*.json'), Path('schemas/wps-v1.schema.json')]:
              json.loads(p.read_text(encoding='utf-8'))
              print('OK', p)
          PY
      - name: Build release variants
        run: python scripts/build.py
