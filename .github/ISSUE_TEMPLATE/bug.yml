name: Bug report
description: Report a reproducible Window Porter problem
title: "[Bug]: "
labels: [bug]
body:
  - type: input
    id: source
    attributes: {label: Source browser/version, placeholder: "Chrome 151"}
    validations: {required: true}
  - type: input
    id: target
    attributes: {label: Target browser/version, placeholder: "Firefox 145"}
    validations: {required: true}
  - type: textarea
    id: steps
    attributes: {label: Reproduction steps}
    validations: {required: true}
  - type: textarea
    id: expected
    attributes: {label: Expected behavior}
  - type: textarea
    id: actual
    attributes: {label: Actual behavior / warnings}
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed private URLs/tokens from any attached WPS fixture.
