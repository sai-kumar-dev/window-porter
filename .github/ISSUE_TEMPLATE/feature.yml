name: Feature request
description: Suggest a portability/reliability improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes: {label: Portability/reliability problem to solve}
    validations: {required: true}
  - type: textarea
    id: proposal
    attributes: {label: Proposed behavior}
  - type: textarea
    id: permissions
    attributes: {label: Would this require new browser permissions or network access?}
